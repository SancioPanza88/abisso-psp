name: Build PSP EBOOT

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set +e
          make 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "MAKE_EXIT=$code" >> $GITHUB_ENV
          grep -nE "error:|Error|undefined reference|missing separator|No rule to make target" build.log | head -25 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done
          exit $code

      - name: Upload build.log (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload EBOOT.PBP artifact
        uses: actions/upload-artifact@v4
        with:
          name: abisso-psp-eboot
          path: EBOOT.PBP
          if-no-files-found: error
