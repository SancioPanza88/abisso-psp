name: Build PSP EBOOT

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set +e
          make 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "MAKE_EXIT=$code" >> $GITHUB_ENV
          exit $code

      - name: Log nel summary (per debug pubblico)
        if: always()
        run: |
          {
            echo "<details><summary>build.log</summary>"
            echo ''
            echo '```'
            tail -n 400 build.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EBOOT.PBP artifact
        uses: actions/upload-artifact@v4
        with:
          name: abisso-psp-eboot
          path: EBOOT.PBP
          if-no-files-found: error
