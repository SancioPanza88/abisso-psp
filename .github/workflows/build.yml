name: Build PSP EBOOT

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set +e
          make > build.log 2>&1
          code=$?
          cat build.log
          grep -nE "error:|Error|undefined reference|missing separator|No rule to make target" build.log | head -25 | while IFS= read -r l; do
            echo "::error::$l"
          done
          exit $code

      - name: Upload EBOOT.PBP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abisso-psp-eboot
          path: EBOOT.PBP
          if-no-files-found: error

      - name: Upload build.log (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
